name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # PR: một group cho mỗi PR, commit mới hủy lần chạy cũ.
  # Push lên main: một group cho mỗi commit, nên các commit không chờ hay hủy nhau.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show tool versions
        run: |
          cmake --version
          c++ --version

      - name: Test experiment scripts
        run: python3 -m unittest discover -s experiments/tests -v

      - name: Configure
        run: cmake -S . -B build/${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/${{ matrix.build_type }} --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build/${{ matrix.build_type }} --build-config ${{ matrix.build_type }} --no-tests=error --output-on-failure