name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          cmake --version
          c++ --version
      - name: Configure
        run: cmake -S . -B build/${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/${{ matrix.build_type }} --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} --build-config ${{ matrix.build_type }} --no-tests=error --output-on-failure -N
      - name: Run tests
        run: ctest --test-dir build/${{ matrix.build_type }} --build-config ${{ matrix.build_type }} --no-tests=error --output-on-failure
